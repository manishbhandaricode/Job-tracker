name: Test Telegram Setup

on:
  workflow_dispatch:
    # Allow manual triggering from the GitHub Actions tab

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    
    steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Requests
      run: pip install requests

    - name: Send Test Message
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python -c "
        import os, requests
        bot_token = os.environ.get('TELEGRAM_BOT_TOKEN')
        chat_id = os.environ.get('TELEGRAM_CHAT_ID')

        if not bot_token or not chat_id:
            print('Error: Secrets are missing or empty!')
            exit(1)

        url = f'https://api.telegram.org/bot{bot_token}/sendMessage'
        payload = {
            'chat_id': chat_id,
            'text': '✅ *Success!* Your Job Tracker is officially connected to Telegram! \n\nYou will receive new job alerts right here.',
            'parse_mode': 'Markdown'
        }
        response = requests.post(url, json=payload)
        
        if response.status_code == 200:
            print('Test message sent successfully!')
        else:
            print(f'Failed to send message: {response.text}')
            exit(1)
        "
